<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shanah City Featured Graphic</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1024px;
        height: 500px;
        overflow: hidden;
      }

      body {
        font-family: Georgia, "Times New Roman", serif;
        color: #fff;
      }

      .canvas {
        position: relative;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 22%, rgba(251, 191, 36, 0.42), transparent 38%),
          radial-gradient(circle at 82% 12%, rgba(244, 114, 182, 0.48), transparent 36%),
          radial-gradient(circle at 72% 88%, rgba(56, 189, 248, 0.32), transparent 42%),
          radial-gradient(circle at 8% 88%, rgba(167, 139, 250, 0.38), transparent 40%),
          linear-gradient(135deg, #0f172a 0%, #1e1b4b 45%, #312e81 100%);
      }

      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 38%,
          rgba(255, 255, 255, 0.1) 50%,
          transparent 62%
        );
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        padding: 48px 56px;
      }

      .left {
        max-width: 520px;
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .logo {
        width: 92px;
        height: 92px;
        object-fit: contain;
        border-radius: 14px;
        border: 2px solid rgba(255, 255, 255, 0.75);
        background: #000;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }

      .brand-name {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand-city {
        margin-top: 4px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.65);
      }

      .headline {
        margin-top: 28px;
        font-size: 42px;
        line-height: 1.08;
        font-weight: 700;
        background: linear-gradient(120deg, #ffffff 0%, #fde68a 35%, #fbcfe8 70%, #e0e7ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .pill {
        display: inline-block;
        margin-top: 22px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.1);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 700;
        color: #fef3c7;
      }

      .phone {
        width: 290px;
        height: 390px;
        border-radius: 34px;
        padding: 12px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
        box-shadow:
          0 24px 60px rgba(15, 23, 42, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        transform: rotate(4deg) translateY(12px);
      }

      .phone-screen {
        width: 100%;
        height: 100%;
        border-radius: 26px;
        overflow: hidden;
        background: #faf8f5;
        box-shadow: inset 0 0 0 1px rgba(26, 35, 50, 0.08);
      }

      .mini-hero {
        padding: 18px 16px;
        background:
          radial-gradient(circle at 20% 20%, rgba(251, 191, 36, 0.45), transparent 42%),
          radial-gradient(circle at 80% 10%, rgba(244, 114, 182, 0.5), transparent 40%),
          linear-gradient(135deg, #0f172a 0%, #1e1b4b 45%, #312e81 100%);
        color: #fff;
      }

      .mini-title {
        font-size: 13px;
        font-weight: 700;
      }

      .mini-tagline {
        margin-top: 10px;
        font-size: 18px;
        line-height: 1.15;
        font-weight: 700;
        background: linear-gradient(120deg, #ffffff 0%, #fde68a 35%, #fbcfe8 70%, #e0e7ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .mini-live {
        margin-top: 12px;
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(to top, rgba(76, 29, 149, 0.95), rgba(225, 29, 72, 0.55));
        min-height: 108px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      .mini-live-label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .mini-live-title {
        margin-top: 6px;
        font-size: 16px;
        font-weight: 700;
      }

      .mini-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 10px;
      }

      .mini-card {
        border-radius: 14px;
        padding: 12px 10px;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        font-weight: 700;
      }

      .card-give {
        background: linear-gradient(135deg, #7c3aed, #c026d3);
      }

      .card-connect {
        background: linear-gradient(135deg, #0ea5e9, #4338ca);
      }

      .card-community {
        background: linear-gradient(135deg, #10b981, #0891b2);
      }

      .card-devotions {
        background: linear-gradient(135deg, #f59e0b, #e11d48);
      }

      .glow {
        position: absolute;
        right: 120px;
        top: 40px;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(244, 114, 182, 0.25), transparent 70%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="glow"></div>
      <div class="content">
        <div class="left">
          <div class="brand-row">
            <img class="logo" src="../public/app-icon-512.png" alt="" />
            <div>
              <div class="brand-name">Shanah City</div>
              <div class="brand-city">Aurora · Accra · Online</div>
            </div>
          </div>
          <h1 class="headline">Changing Lives To Higher Levels In God.</h1>
          <div class="pill">Watch live · Devotions · Community</div>
        </div>

        <div class="phone" aria-hidden="true">
          <div class="phone-screen">
            <div class="mini-hero">
              <div class="mini-title">Shanah City</div>
              <div class="mini-tagline">Changing Lives To Higher Levels In God.</div>
              <div class="mini-live">
                <div class="mini-live-label">Media</div>
                <div class="mini-live-title">Watch live worship</div>
              </div>
            </div>
            <div class="mini-grid">
              <div class="mini-card card-give">Give</div>
              <div class="mini-card card-connect">Connect</div>
              <div class="mini-card card-community">Community</div>
              <div class="mini-card card-devotions">Devotions</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

name: Publish devotions

# Primary scheduler: every 5 min. Vercel also runs a daily backup (vercel.json).
# Requires GitHub secret CRON_SECRET (same value as on Vercel).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-devotions-cron
  cancel-in-progress: false

jobs:
  notify:
    name: Send due devotion pushes
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: POST /api/cron/publish-devotions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://shanah-city.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning title=CRON_SECRET missing::Devotion pushes are skipped. Add CRON_SECRET to GitHub repo secrets (same value as Vercel)."
            exit 0
          fi
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --write-out '\nHTTP:%{http_code}' \
            "$APP_URL/api/cron/publish-devotions")"
          echo "$response"
          body="${response%HTTP:*}"
          echo "$body" | grep -q '"notified":0' && echo "$body" | grep -q '"skipped":true' && \
            echo "::notice::Devotion cron ran but nothing was due to send yet."

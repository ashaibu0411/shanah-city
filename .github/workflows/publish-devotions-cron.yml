name: Publish devotions

# Vercel Hobby cannot run sub-daily crons, so scheduled devotion pushes run here.
# Requires GitHub secret CRON_SECRET (same value as on Vercel).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-devotions-cron
  cancel-in-progress: false

jobs:
  notify:
    name: Send due devotion pushes
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: POST /api/cron/publish-devotions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://shanah-city.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set — skipping."
            exit 0
          fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/publish-devotions"

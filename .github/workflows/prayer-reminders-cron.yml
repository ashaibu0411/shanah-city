name: Prayer reminders

# Primary scheduler: every 5 min. Vercel also runs a daily backup (vercel.json).
# Requires GitHub secret CRON_SECRET (same value as on Vercel).
# Use "Run workflow" (not "Re-run jobs") after workflow changes — re-runs keep the old script.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: prayer-reminders-cron
  cancel-in-progress: false

jobs:
  notify:
    name: Send due morning/evening prayer pushes
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: GET /api/cron/morning-prayer (Shift Your Morning + Evening)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://shanah-city.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning title=CRON_SECRET missing::Prayer pushes are skipped. Add CRON_SECRET to GitHub repo secrets (same value as Vercel)."
            exit 0
          fi
          http_code="$(curl --silent --show-error -o /tmp/cron-response.json -w '%{http_code}' \
            -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/morning-prayer")"
          echo "HTTP ${http_code}"
          cat /tmp/cron-response.json
          echo ""
          if [ "$http_code" = "405" ]; then
            echo "::error::HTTP 405 — this run used POST or an old workflow. Click Actions → Prayer reminders → Run workflow (do not Re-run jobs)."
            exit 1
          fi
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cron request failed with HTTP ${http_code}"
            exit 1
          fi

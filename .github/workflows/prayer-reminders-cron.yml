name: Prayer reminders

# Primary scheduler: every 5 min. Vercel also runs daily backups (vercel.json).
# Requires GitHub secret CRON_SECRET (same value as on Vercel).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: prayer-reminders-cron
  cancel-in-progress: false

jobs:
  notify:
    name: Send due morning/evening prayer pushes
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: POST /api/cron/morning-prayer (Shift Your Morning + Evening)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://shanah-city.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning title=CRON_SECRET missing::Prayer pushes are skipped. Add CRON_SECRET to GitHub repo secrets (same value as Vercel)."
            exit 0
          fi
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --write-out '\nHTTP:%{http_code}' \
            "$APP_URL/api/cron/morning-prayer")"
          echo "$response"
          body="${response%HTTP:*}"
          echo "$body" | grep -q '"skipped":true' && \
            echo "::notice::Prayer cron ran but no reminders were due to send yet."

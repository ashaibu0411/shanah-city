name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - "mobile/**"
      - "scripts/generate-ios-icon.cjs"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60

    env:
      BUNDLE_ID: org.shanahcity.app
      XCODE_PROJECT: ios/App/App.xcodeproj
      XCODE_SCHEME: App
      CAPACITOR_SERVER_URL: https://shanah-city.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS app icon
        run: node scripts/generate-ios-icon.cjs

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Import Apple distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          keychain: build-signing
          keychain-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Configure signing keychain
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/build-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "Available signing identities:"
          security find-identity -v -p codesigning

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > "$PROFILE_PATH"
          PROFILE_PLIST="$(security cms -D -i "$PROFILE_PATH")"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" /dev/stdin <<< "$PROFILE_PLIST")
          echo "Installed profile: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile team: $PROFILE_TEAM"
          echo "Profile app id: $PROFILE_APP_ID"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_TEAM=$PROFILE_TEAM" >> "$GITHUB_ENV"

      - name: Normalize signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          TEAM_ID="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')"
          if [ -z "$TEAM_ID" ] || [ -z "$IOS_PROVISIONING_PROFILE_NAME" ]; then
            echo "APPLE_TEAM_ID and a valid provisioning profile are required."
            exit 1
          fi
          if [ "$TEAM_ID" != "$PROFILE_TEAM" ] && [ -n "$PROFILE_TEAM" ]; then
            echo "Team ID mismatch: secret=$TEAM_ID profile=$PROFILE_TEAM"
            exit 1
          fi
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning | sed -n 's/ *[^"]*"\(Apple Distribution.*\)"/\1/p' | head -n 1)"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No Apple Distribution signing identity found in keychain."
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Using signing identity: $SIGNING_IDENTITY"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare export options
        run: |
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$BUNDLE_ID $IOS_PROVISIONING_PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Build archive
        run: |
          echo "Workflow commit: $GITHUB_SHA"
          echo "Signing identity: $SIGNING_IDENTITY"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile name: $IOS_PROVISIONING_PROFILE_NAME"
          ARCHIVE_PATH="$RUNNER_TEMP/App.xcarchive"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            archive
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export IPA
        run: |
          EXPORT_PATH="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH=$(find "$EXPORT_PATH" -maxdepth 1 -name "*.ipa" | head -n 1)
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: shanah-city-ios-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

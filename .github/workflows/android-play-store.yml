name: Android Play Store

# Uploads a signed App Bundle to Google Play.
# Push to main → internal testing only. Production is manual (Play Console promote or workflow choice).

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - production
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "mobile/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-play-store.yml"

concurrency:
  group: android-play-store-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.track || 'internal' }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build and upload (${{ github.event_name == 'workflow_dispatch' && inputs.track || 'internal' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.track == 'production' && 'play-store-production' || '' }}

    env:
      CAPACITOR_SERVER_URL: https://shanah-city.vercel.app
      PACKAGE_NAME: org.shanahcity.app
      PLAY_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'internal' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Import release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="android/app/release.keystore"

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required."
            exit 1
          fi

          CLEAN="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [ -z "$CLEAN" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty after trimming whitespace."
            exit 1
          fi
          if printf '%s' "$CLEAN" | grep -q 'BEGIN'; then
            echo "ANDROID_KEYSTORE_BASE64 looks like PEM text (BEGIN/END lines)."
            echo "Paste only the raw base64 string from PowerShell, not certutil output."
            exit 1
          fi

          if ! printf '%s' "$CLEAN" | base64 -d > "$KEYSTORE_PATH" 2>/dev/null; then
            echo "Failed to decode ANDROID_KEYSTORE_BASE64."
            echo "Re-encode your .jks file as one continuous base64 line and update the GitHub secret."
            exit 1
          fi

          BYTES="$(wc -c < "$KEYSTORE_PATH" | tr -d ' ')"
          if [ "$BYTES" -lt 100 ]; then
            echo "Decoded keystore is only ${BYTES} bytes, which is too small to be valid."
            exit 1
          fi
          echo "Imported keystore (${BYTES} bytes)."

      - name: Build release App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets are required."
            exit 1
          fi
          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: shanah-city-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.shanahcity.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ env.PLAY_TRACK }}
          status: completed

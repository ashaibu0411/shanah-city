name: One-off Next build memory profile
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build-memory-diagnostics.cjs"
      - ".github/workflows/vision-build-memory-profile.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    if: github.head_ref == 'chore/profile-build-memory-run-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Record runner resource limits
        run: |
          free -h
          node -p "'Node heap limit: ' + Math.round(require('v8').getHeapStatistics().heap_size_limit / 1024 / 1024) + ' MiB'"
      - name: Install without external app credentials
        run: npm ci
      - name: Generate Prisma client without database access
        run: npx prisma generate
      - name: Profile Next.js build memory (no production environment or secrets)
        run: npm run diagnose:build-memory

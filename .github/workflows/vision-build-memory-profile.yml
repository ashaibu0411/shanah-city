name: Next.js build memory comparison (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Record runner resource limits
        run: |
          free -h
          node -p "'Node heap limit: ' + Math.round(require('v8').getHeapStatistics().heap_size_limit / 1024 / 1024) + ' MiB'"
      - name: Install without external app credentials
        run: npm ci
      - name: Generate Prisma client without database access
        run: npx prisma generate
      - name: Profile Next.js build memory (no production environment or secrets)
        run: npm run diagnose:build-memory
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Record runner resource limits
        run: free -h
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Measure normal Next.js build process-tree RSS
        run: node scripts/build-memory-baseline.cjs

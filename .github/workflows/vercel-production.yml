name: Vercel Production Deploy

# Backup when Vercel GitHub auto-deploy stops firing (common).
# Setup (one time):
# 1. Vercel → shanah-city → Settings → Git → Deploy Hooks → Create (branch: main)
# 2. GitHub → repo Settings → Secrets → Actions → VERCEL_DEPLOY_HOOK = hook URL
#
# Also fix the primary path: Vercel → Settings → Git → reconnect ashaibu0411/shanah-city.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-vercel:
    name: Trigger Vercel production build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: POST deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set. Skipping backup deploy."
            echo "Add the deploy hook secret, or redeploy manually in the Vercel dashboard."
            exit 0
          fi
          echo "Triggering Vercel deploy hook for ${GITHUB_SHA}"
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          echo "Deploy hook triggered."

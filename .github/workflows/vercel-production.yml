name: Vercel Production Deploy

# Backup deploy path when the Vercel GitHub webhook stops firing.
# Setup (one time):
# 1. Vercel → shanah-city → Settings → Git → Deploy Hooks → Create (branch: main)
# 2. GitHub → repo Settings → Secrets → Actions → New secret: VERCEL_DEPLOY_HOOK = hook URL

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-vercel:
    name: Trigger Vercel production build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: POST deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret is not set — skipping."
            echo "Add it from Vercel → Settings → Git → Deploy Hooks, then re-run this workflow."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          echo "Deploy hook triggered."

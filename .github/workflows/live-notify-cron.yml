name: Live stream notify

# Vercel Hobby only allows daily crons, so scheduled live push checks run here instead.
# Add GitHub secret CRON_SECRET (same value as on Vercel).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: live-notify-cron
  cancel-in-progress: false

jobs:
  notify:
    name: Check scheduled livestream notifications
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: POST /api/cron/live-notify
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://shanah-city.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set — skipping."
            exit 0
          fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/live-notify"
